name: Build .NET MAUI App Android

on:
  push:
    branches: ["**"]
    tags: ["v*", "[0-9]*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release version or tag (for example, v1.2.3 or 1.2.3-beta.1)."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish_release: ${{ steps.version.outputs.publish_release }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Resolve application version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          requested_version="${{ inputs.version }}"
          publish_release=false
          tag_name=""

          if [[ -n "$requested_version" ]]; then
            resolved="$requested_version"
            tag_name="$requested_version"
            publish_release=true
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            resolved="${GITHUB_REF_NAME}"
            tag_name="${GITHUB_REF_NAME}"
            publish_release=true
          else
            latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=1" --jq '.[0].tag_name // empty' 2>/dev/null || true)"
            stable_core="${latest_tag#v}"
            stable_core="${stable_core%%+*}"
            stable_core="${stable_core%%-*}"

            IFS='.' read -r major minor patch _ <<< "$stable_core"
            [[ "${major:-}" =~ ^[0-9]+$ ]] || major=0
            [[ "${minor:-}" =~ ^[0-9]+$ ]] || minor=0
            [[ "${patch:-}" =~ ^[0-9]+$ ]] || patch=0

            patch=$((patch + 1))
            resolved="${major}.${minor}.${patch}-0.${GITHUB_RUN_NUMBER}"
          fi

          version="${resolved#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Resolved version '$version' is not a supported semantic version." >&2
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "publish_release=$publish_release" >> "$GITHUB_OUTPUT"
          echo "Building MBF Launcher $version (publish release: $publish_release)"

      - name: Set up signing keystore
        shell: bash
        run: echo -n "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > myapp.keystore

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "MBF Launcher/web/package-lock.json"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install .NET MAUI workload
        run: dotnet workload install maui

      - name: Restore dependencies
        run: dotnet restore

      - name: Build signed APK
        shell: pwsh
        run: |
          & dotnet build "MBF Launcher/MBF Launcher.csproj" `
            -c Release `
            -f net9.0-android35.0 `
            /p:Version="${{ steps.version.outputs.version }}" `
            /p:ApplicationDisplayVersion="${{ steps.version.outputs.version }}" `
            /p:ApplicationVersion="${{ github.run_number }}" `
            /p:AndroidSigningKeyStore=myapp.keystore `
            /p:AndroidSigningKeyAlias=com.dantheman827.mbflauncher `
            /p:AndroidSigningKeyPass="${{ secrets.KEYSTORE_PASSWORD }}" `
            /p:AndroidSigningStorePass="${{ secrets.KEYSTORE_PASSWORD }}" `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet build failed with exit code $LASTEXITCODE"
          }

          $outputRoot = Join-Path $PWD "MBF Launcher/bin/Release/net9.0-android35.0"
          $apk = Get-ChildItem -Path $outputRoot -Recurse -Filter "*-Signed.apk" |
            Where-Object { $_.Name -notmatch "unaligned" } |
            Sort-Object @{ Expression = { if ($_.Name -match "arm64|universal") { 0 } else { 1 } } }, FullName |
            Select-Object -First 1

          if ($null -eq $apk) {
            throw "No signed APK was produced under $outputRoot"
          }

          $artifactDirectory = Join-Path $PWD "artifacts"
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
          $safeVersion = "${{ steps.version.outputs.version }}" -replace '[^0-9A-Za-z._-]', '_'
          $artifactPath = Join-Path $artifactDirectory "MBF-Launcher-$safeVersion.apk"
          Copy-Item -LiteralPath $apk.FullName -Destination $artifactPath -Force
          Write-Host "Prepared $artifactPath from $($apk.FullName)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mbf-launcher-${{ steps.version.outputs.version }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    if: needs.build.outputs.publish_release == 'true'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: mbf-launcher-${{ needs.build.outputs.version }}
          path: release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.apk
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: MBF Launcher ${{ needs.build.outputs.version }}
          draft: false
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
